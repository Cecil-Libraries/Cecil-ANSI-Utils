name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

env:
  REPO_AUTHOR: "Cecil-Libraries"
  REPO_NAME: "Cecil-ANSI-Utils"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.STATS }}
          fetch-depth: 0

      - name: Create profile dir
        run: mkdir -p profile

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=${{ env.REPO_AUTHOR }}&repo=${{ env.REPO_NAME }}&theme=shades-of-purple&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage
          path: profile/pin-readme-tools-github-readme-stats.svg
          token: ${{ secrets.STATS }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create branch and commit
        run: |
          git checkout -b feature/automated-update
          echo "Last updated: $(date)" > update-log.txt
          git add profile/*.svg update-log.txt
          git commit -m "docs: automated update of log file" || exit 0
          git push origin HEAD:feature/automated-update

      - name: Create or update PR
        id: pr
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.STATS }}
          script: |
            const branch = 'feature/automated-update';
            const { owner, repo } = context.repo;

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branch}`,
              base: 'main',
              state: 'open',
            });

            if (pulls.data.length === 0) {
              const pr = await github.rest.pulls.create({
                owner,
                repo,
                title: '[CI] Merge stats update into main',
                head: branch,
                base: 'main',
                body: [
                  'This PR is auto-generated by GitHub Actions.',
                ].join('\n'),
              });

              core.setOutput('number', pr.data.number);
            } else {
              const pr = pulls.data[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                body: [
                  pr.body || '',
                  `Updated by job ${context.job}.`,
                ].join('\n'),
              });

              core.setOutput('number', pr.number);
            }

      - name: Wait for Windows Builds
        uses: poseidon/wait-for-status-checks@v0.6.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Regex to match only the "Build Output / Windows..." jobs
          match_pattern: 'Build Output / Windows.*'
          # Polling configuration based on your inputs
          interval: 10s
          timeout: 3600s
          delay: 5s
          
      - name: Auto-approve PR
        uses: juliangruber/approve-pull-request-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          number: ${{ steps.pr.outputs.number }}

      - name: Merge Pull Request
        uses: juliangruber/merge-pull-request-action@v1
        with:
          github-token: ${{ secrets.STATS }}
          number: ${{ steps.pr.outputs.number }}
          method: squash
