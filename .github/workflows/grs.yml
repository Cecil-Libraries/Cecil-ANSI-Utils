name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate pin card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: pin
          options: username=readme-tools&repo=github-readme-stats&theme=shades-of-purple&show=reviews,discussions_started,discussions_answered,prs_merged,prs_merged_percentage
          path: profile/pin-readme-tools-github-readme-stats.svg
          token: ${{ secrets.STATS }}

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.STATS }}
          commit-message: "Update README cards"
          title: "🤖 Update stats cards"
          body: "Automated update of profile cards"
          branch: update-stats-cards
          delete-branch: true
          base: main

      - name: Auto-approve PR
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: juliangruber/auto-approve-action@v1
        with:
          github-token: ${{ secrets.STATS }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.STATS }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: squash
