# .github/workflows/nativeaot-cross.yml
name: NativeAOT Cross-Platform

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

env:
  OUTPUT_ROOT: GITHUB_RELEASE

jobs:
  # --------------------------
  # Windows batch build
  # --------------------------
  windows-batch:
    name: Windows Batch Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Windows Build Batch
        run: |
          call Build.bat Release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: ${{ env.OUTPUT_ROOT }}\**\*

  # --------------------------
  # Linux matrix builds
  # --------------------------
  native-linux:
    name: Linux ${{ matrix.os }} / ${{ matrix.dotnet }} / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04 ]
        dotnet: [ '8.0.x', '9.0.x', '10.0.x' ]
        rid: [ linux-x64, linux-arm64 ]
        exclude:
          - os: ubuntu-latest
            rid: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Install clang (Linux ARM64)
        if: contains(matrix.rid, 'linux-arm64')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build NativeAOT
        run: |
          mkdir -p ${{ env.OUTPUT_ROOT }}/NATIVE
      
          dotnet publish "Cecil ANSI Utils Native/Cecil ANSI Utils Native.csproj" \
            -f net${{ matrix.dotnet }} \
            -r ${{ matrix.rid }} \
            -c Release \
            -p:PublishAot=true \
            -p:NativeLib=Shared \
            -o publish \
            --no-restore
      
          echo "=============================="
          echo "Native Output Inspection"
          echo "=============================="
      
          ls -lah publish
      
          echo ""
          echo "---- file info ----"
          file publish/* || true
      
          echo ""
          echo "---- exported symbols (nm) ----"
          nm -D publish/*.so || true
      
          echo ""
          echo "---- exported symbols (objdump) ----"
          objdump -T publish/*.so || true
      
          cp "LICENSE.md" publish/
          cp "README.md" publish/
          cp "Native Core/Cecil_ANSI_Utils.h" publish/
      
          cd publish
          zip -r Native-${{ matrix.dotnet }}-${{ matrix.rid }}.zip *
          mv Native-${{ matrix.dotnet }}-${{ matrix.rid }}.zip ../${{ env.OUTPUT_ROOT }}/NATIVE/
          cd ..

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: ${{ env.OUTPUT_ROOT }}/NATIVE/*

  # --------------------------
  # macOS matrix builds
  # --------------------------
  native-macos:
    name: macOS ${{ matrix.os }} / ${{ matrix.dotnet }} / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-13, macos-14 ]
        dotnet: [ '8.0.x', '9.0.x', '10.0.x' ]
        rid: [ osx-x64, osx-arm64 ]
        exclude:
          - os: macos-13
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Build NativeAOT
        run: |
          mkdir -p ${{ env.OUTPUT_ROOT }}/NATIVE
      
          dotnet publish "Cecil ANSI Utils Native/Cecil ANSI Utils Native.csproj" \
            -f net${{ matrix.dotnet }} \
            -r ${{ matrix.rid }} \
            -c Release \
            -p:PublishAot=true \
            -p:NativeLib=Shared \
            -o publish \
            --no-restore
      
          echo "=============================="
          echo "Native Output Inspection"
          echo "=============================="
      
          ls -lah publish
      
          echo ""
          echo "---- file info ----"
          file publish/* || true
      
          echo ""
          echo "---- exported symbols (nm) ----"
          nm -gU publish/*.dylib || true
      
          echo ""
          echo "---- exported symbols (otool) ----"
          otool -L publish/*.dylib || true
      
          cp "LICENSE.md" publish/
          cp "README.md" publish/
          cp "Native Core/Cecil_ANSI_Utils.h" publish/
      
          cd publish
          zip -r Native-${{ matrix.dotnet }}-${{ matrix.rid }}.zip *
          mv Native-${{ matrix.dotnet }}-${{ matrix.rid }}.zip ../${{ env.OUTPUT_ROOT }}/NATIVE/
          cd ..

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: ${{ env.OUTPUT_ROOT }}/NATIVE/*

  # --------------------------
  # Release job
  # --------------------------
  release:
    name: Release Artifacts
    needs: [ windows-batch, native-linux, native-macos ]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release folder
        run: |
          mkdir -p ${{ env.OUTPUT_ROOT }}/NATIVE
          cp -r ${{ github.workspace }}/GITHUB_RELEASE/NATIVE/* ${{ env.OUTPUT_ROOT }}/NATIVE/
          # Include docs & header
          cp "LICENSE.md" ${{ env.OUTPUT_ROOT }}/NATIVE/
          cp "README.md" ${{ env.OUTPUT_ROOT }}/NATIVE/
          cp "Native Core/Cecil_ANSI_Utils.h" ${{ env.OUTPUT_ROOT }}/NATIVE/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_ROOT }}/NATIVE/**/*