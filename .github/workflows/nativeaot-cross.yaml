name: NativeAOT Cross-Platform Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read
  packages: write

env:
  CS_PROJ: "Cecil ANSI Utils.csproj"
  NATIVE_PROJ: "Cecil ANSI Utils Native/Cecil ANSI Utils Native.csproj"
  OUTPUT_ROOT: "GITHUB_RELEASE"

jobs:
  # ---------------------------------------------------------
  # WINDOWS BUILD (DLLs + NuGet)
  # ---------------------------------------------------------
  windows-build:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build and Pack
        shell: powershell
        run: |
          $CONFIG = "Release"
          $OUT_DIR = "${{ env.OUTPUT_ROOT }}"
          New-Item -ItemType Directory -Path "$OUT_DIR\NATIVE", "$OUT_DIR\NET", "$OUT_DIR\NUGET" -Force

          # 1. Build Base Library First (Standard DLL)
          dotnet build "${{ env.CS_PROJ }}" -c $CONFIG

          # 2. Build NativeAOT Shared Libs
          [xml]$nativeXml = Get-Content "${{ env.NATIVE_PROJ }}"
          $TFs = $nativeXml.Project.PropertyGroup.TargetFrameworks -split ';' | Where-Object { $_ }
          $RIDs = $nativeXml.Project.PropertyGroup.RuntimeIdentifiers -split ';' | Where-Object { $_ -like "win-*" }

          foreach ($tf in $TFs) {
            foreach ($rid in $RIDs) {
              $pub = "$OUT_DIR\_tmp\$tf-$rid"
              # Apply Stripping and Linker optimizations
              dotnet publish "${{ env.NATIVE_PROJ }}" -c $CONFIG -f $tf -r $rid -o $pub `
                -p:PublishAot=true `
                -p:NativeLib=Shared `
                -p:StripSymbols=true `
                -p:IlcGenerateStackTraceData=false `
                -p:RootAllApplicationAssemblies=true
              
              copy "Native Core\Cecil_ANSI_Utils.h" "$pub\"
              Compress-Archive -Path "$pub\*" -DestinationPath "$OUT_DIR\NATIVE\Native-$tf-$rid.zip" -Force
            }
          }

          # 3. Pack NuGet
          dotnet pack "${{ env.CS_PROJ }}" -c $CONFIG -o "$OUT_DIR\NUGET"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ${{ env.OUTPUT_ROOT }}/**/*

  # ---------------------------------------------------------
  # LINUX BUILD (.so)
  # ---------------------------------------------------------
  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      
      - name: Install Native Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libicu-dev lld

      - name: Build Native
        run: |
          CONFIG="Release"
          OUT_DIR="${{ env.OUTPUT_ROOT }}"
          mkdir -p "$OUT_DIR/NATIVE"
          
          TFS=$(cat "${{ env.NATIVE_PROJ }}" | sed -n 's/.*<TargetFrameworks>\(.*\)<\/TargetFrameworks>.*/\1/p' | tr ';' ' ')
          RIDS=$(cat "${{ env.NATIVE_PROJ }}" | sed -n 's/.*<RuntimeIdentifiers>\(.*\)<\/RuntimeIdentifiers>.*/\1/p' | tr ';' '\n' | grep 'linux-' | tr '\n' ' ')

          for tf in $TFS; do
            for rid in $RIDS; do
              PUB="$OUT_DIR/_tmp/$tf-$rid"
              # RootAllApplicationAssemblies=true ensures the linker doesn't strip the NativeAOT startup code
              dotnet publish "${{ env.NATIVE_PROJ }}" -c $CONFIG -f $tf -r $rid -o "$PUB" \
                -p:PublishAot=true \
                -p:NativeLib=Shared \
                -p:StripSymbols=true \
                -p:RootAllApplicationAssemblies=true \
                -p:CppCompilerAndLinker=clang
              
              cp "Native Core/Cecil_ANSI_Utils.h" "$PUB/"
              cd "$PUB" && zip -r "../../NATIVE/Native-$tf-$rid.zip" . && cd -
            done
          done

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: ${{ env.OUTPUT_ROOT }}/NATIVE/*.zip

  # ---------------------------------------------------------
  # MACOS BUILD (.dylib)
  # ---------------------------------------------------------
  macos-build:
    name: macOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Native
        run: |
          CONFIG="Release"
          OUT_DIR="${{ env.OUTPUT_ROOT }}"
          mkdir -p "$OUT_DIR/NATIVE"
          
          TFS=$(cat "${{ env.NATIVE_PROJ }}" | sed -n 's/.*<TargetFrameworks>\(.*\)<\/TargetFrameworks>.*/\1/p' | tr ';' ' ')
          RIDS=$(cat "${{ env.NATIVE_PROJ }}" | sed -n 's/.*<RuntimeIdentifiers>\(.*\)<\/RuntimeIdentifiers>.*/\1/p' | tr ';' '\n' | grep 'osx-' | tr '\n' ' ')

          for tf in $TFS; do
            for rid in $RIDS; do
              PUB="$OUT_DIR/_tmp/$tf-$rid"
              # Using StripSymbols and disabling stack trace data for macOS size reduction
              dotnet publish "${{ env.NATIVE_PROJ }}" -c $CONFIG -f $tf -r $rid -o "$PUB" \
                -p:PublishAot=true \
                -p:NativeLib=Shared \
                -p:StripSymbols=true \
                -p:IlcGenerateStackTraceData=false \
                -p:RootAllApplicationAssemblies=true
                
              cp "Native Core/Cecil_ANSI_Utils.h" "$PUB/"
              cd "$PUB" && zip -r "../../NATIVE/Native-$tf-$rid.zip" . && cd -
            done
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: ${{ env.OUTPUT_ROOT }}/NATIVE/*.zip

  # ---------------------------------------------------------
  # RELEASE
  # ---------------------------------------------------------
  publish-release:
    needs: [windows-build, linux-build, macos-build]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "**/*.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: ${{ env.OUTPUT_ROOT }}\**\*

  # --------------------------
  # Linux matrix builds
  # --------------------------
  native-linux:
    name: Linux ${{ matrix.os }} / ${{ matrix.dotnet }} / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04 ]
        dotnet: [ '8.0.x', '9.0.x', '10.0.x' ]
        rid: [ linux-x64, linux-arm64 ]
        exclude:
          - os: ubuntu-latest
            rid: linux-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Install clang (Linux ARM64)
        if: contains(matrix.rid, 'linux-arm64')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build NativeAOT
        run: |
          mkdir -p ${{ env.OUTPUT_ROOT }}/NATIVE
      
          dotnet publish "Cecil ANSI Utils Native/Cecil ANSI Utils Native.csproj" \
            -f net${{ matrix.dotnet }} \
            -r ${{ matrix.rid }} \
            -c Release \
            -p:PublishAot=true \
            -p:NativeLib=Shared \
            -o publish \
            --no-restore
      
          echo "=============================="
          echo "Native Output Inspection"
          echo "=============================="
      
          ls -lah publish
      
          echo ""
          echo "---- file info ----"
          file publish/* || true
      
          echo ""
          echo "---- exported symbols (nm) ----"
          nm -D publish/*.so || true
      
          echo ""
          echo "---- exported symbols (objdump) ----"
          objdump -T publish/*.so || true
      
          cp "LICENSE.md" publish/
          cp "README.md" publish/
          cp "Native Core/Cecil_ANSI_Utils.h" publish/
      
          cd publish
          zip -r Native-${{ matrix.dotnet }}-${{ matrix.rid }}.zip *
          mv Native-${{ matrix.dotnet }}-${{ matrix.rid }}.zip ../${{ env.OUTPUT_ROOT }}/NATIVE/
          cd ..

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: ${{ env.OUTPUT_ROOT }}/NATIVE/*

  # --------------------------
  # macOS matrix builds
  # --------------------------
  native-macos:
    name: macOS ${{ matrix.os }} / ${{ matrix.dotnet }} / ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-13, macos-14 ]
        dotnet: [ '8.0.x', '9.0.x', '10.0.x' ]
        rid: [ osx-x64, osx-arm64 ]
        exclude:
          - os: macos-13
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET ${{ matrix.dotnet }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Build NativeAOT
        run: |
          mkdir -p ${{ env.OUTPUT_ROOT }}/NATIVE
      
          dotnet publish "Cecil ANSI Utils Native/Cecil ANSI Utils Native.csproj" \
            -f net${{ matrix.dotnet }} \
            -r ${{ matrix.rid }} \
            -c Release \
            -p:PublishAot=true \
            -p:NativeLib=Shared \
            -o publish \
            --no-restore
      
          echo "=============================="
          echo "Native Output Inspection"
          echo "=============================="
      
          ls -lah publish
      
          echo ""
          echo "---- file info ----"
          file publish/* || true
      
          echo ""
          echo "---- exported symbols (nm) ----"
          nm -gU publish/*.dylib || true
      
          echo ""
          echo "---- exported symbols (otool) ----"
          otool -L publish/*.dylib || true
      
          cp "LICENSE.md" publish/
          cp "README.md" publish/
          cp "Native Core/Cecil_ANSI_Utils.h" publish/
      
          cd publish
          zip -r Native-${{ matrix.dotnet }}-${{ matrix.rid }}.zip *
          mv Native-${{ matrix.dotnet }}-${{ matrix.rid }}.zip ../${{ env.OUTPUT_ROOT }}/NATIVE/
          cd ..

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: ${{ env.OUTPUT_ROOT }}/NATIVE/*

  # --------------------------
  # Release job
  # --------------------------
  release:
    name: Release Artifacts
    needs: [ windows-build, native-linux, native-macos ]
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Prepare release folder
        run: |
          mkdir -p ${{ env.OUTPUT_ROOT }}/NATIVE
          cp -r ${{ github.workspace }}/GITHUB_RELEASE/NATIVE/* ${{ env.OUTPUT_ROOT }}/NATIVE/
          # Include docs & header
          cp "LICENSE.md" ${{ env.OUTPUT_ROOT }}/NATIVE/
          cp "README.md" ${{ env.OUTPUT_ROOT }}/NATIVE/
          cp "Native Core/Cecil_ANSI_Utils.h" ${{ env.OUTPUT_ROOT }}/NATIVE/

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUTPUT_ROOT }}/NATIVE/**/*
